<svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d15"/><stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="760" fill="url(#bgGrad)" rx="14"/>

  <!-- Title -->
  <text x="410" y="30" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">Topologi LVM Storage Operator</text>
  <text x="410" y="48" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">OpenShift SNO 4.18 — bc-24-11-42-89-79</text>

  <!-- ═══════════════ ROW 1: APP + SC ═══════════════ -->
  <!-- PVC -->
  <rect x="50" y="70" width="280" height="62" rx="8" fill="rgba(10,22,37,0.95)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="190" y="92" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">PersistentVolumeClaim</text>
  <text x="190" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">StorageClass: lvms-lvms-local-block</text>
  <text x="190" y="124" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">WaitForFirstConsumer</text>

  <!-- Arrow PVC → SC -->
  <path d="M 330 101 L 370 101" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- StorageClass -->
  <rect x="380" y="70" width="250" height="62" rx="8" fill="rgba(10,22,37,0.95)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="505" y="92" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">StorageClass</text>
  <text x="505" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">lvms-lvms-local-block</text>
  <text x="505" y="124" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">allowVolumeExpansion: true</text>

  <!-- ═══════════════ ROW 2: CONTROL + DATA PLANE ═══════════════ -->
  <!-- Section labels -->
  <text x="190" y="170" fill="#34d399" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.2">CONTROL PLANE</text>
  <text x="565" y="170" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.2">DATA PLANE</text>

  <!-- Arrow SC → Operator -->
  <path d="M 505 132 L 505 172 L 190 172 L 190 186" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LVM Operator -->
  <rect x="50" y="190" width="280" height="82" rx="8" fill="rgba(10,26,20,0.95)" stroke="#34d399" stroke-width="1.5"/>
  <text x="190" y="212" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">LVM Operator</text>
  <text x="190" y="228" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Deployment · openshift-storage</text>
  <rect x="70" y="238" width="240" height="24" rx="4" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
  <text x="190" y="255" fill="#6ee7b7" font-family="monospace" font-size="9" text-anchor="middle">topolvm-controller (CSI embedded)</text>

  <!-- Arrow Operator → VG Manager -->
  <path d="M 330 231 L 380 231" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="355" y="224" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">gRPC</text>

  <!-- VG Manager -->
  <rect x="390" y="190" width="280" height="82" rx="8" fill="rgba(26,26,12,0.95)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="212" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">VG Manager</text>
  <text x="530" y="228" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">DaemonSet · per worker node</text>
  <rect x="410" y="238" width="240" height="24" rx="4" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
  <text x="530" y="255" fill="#fcd34d" font-family="monospace" font-size="9" text-anchor="middle">topolvm-node · lvmd (CSI embedded)</text>

  <!-- ═══════════════ ROW 3: WORKER NODE ═══════════════ -->
  <!-- Arrow down from VG Manager + Operator to node -->
  <path d="M 410 272 L 410 310" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="425" y="296" fill="#64748b" font-family="sans-serif" font-size="9">lvcreate</text>

  <text x="410" y="330" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.2">WORKER NODE — bc-24-11-42-89-79 (192.168.1.249)</text>

  <!-- Node boundary -->
  <rect x="30" y="344" width="760" height="390" rx="10" fill="rgba(76,29,149,0.04)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- VG box (left side) -->
  <rect x="60" y="368" width="300" height="100" rx="8" fill="rgba(76,29,149,0.1)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="210" y="390" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Volume Group</text>
  <text x="210" y="408" fill="#c4b5fd" font-family="monospace" font-size="11" text-anchor="middle">lvms-local-block</text>

  <!-- Thin pool (inside VG) -->
  <rect x="85" y="422" width="250" height="34" rx="5" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="210" y="438" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">thin-pool-1</text>
  <text x="210" y="451" fill="#8b7cf6" font-family="sans-serif" font-size="9" text-anchor="middle">90% VG · overprovisionRatio: 10</text>

  <!-- Physical disk (right side) -->
  <rect x="420" y="368" width="240" height="100" rx="8" fill="rgba(30,41,59,0.95)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="540" y="390" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Physical Volume</text>
  <text x="540" y="408" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">/dev/sdb</text>
  <text x="540" y="426" fill="#475569" font-family="sans-serif" font-size="9" text-anchor="middle">15 GB · raw disk</text>
  <text x="540" y="443" fill="#475569" font-family="sans-serif" font-size="9" text-anchor="middle">no partition, no filesystem</text>
  <text x="540" y="460" fill="#334155" font-family="sans-serif" font-size="8" text-anchor="middle">wajib kosong — LVM operator tolak jika ada signature</text>

  <!-- Arrow VG ↔ Disk -->
  <path d="M 360 418 L 420 418" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="412" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">PV</text>

  <!-- ═══════════════ BOTTOM: Logical Volumes ═══════════════ -->
  <rect x="60" y="492" width="700" height="1" fill="#1e293b"/>

  <text x="410" y="520" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">LOGICAL VOLUMES (dibuat on-demand saat Pod dijadwalkan)</text>

  <!-- 3 LV boxes -->
  <rect x="80" y="538" width="180" height="40" rx="5" fill="rgba(10,22,37,0.9)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="170" y="558" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">lv-pvc-abc123</text>
  <text x="170" y="572" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">10 Gi · thin provisioned</text>

  <rect x="290" y="538" width="180" height="40" rx="5" fill="rgba(10,22,37,0.9)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="380" y="558" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">lv-pvc-def456</text>
  <text x="380" y="572" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">5 Gi · thin provisioned</text>

  <rect x="500" y="538" width="180" height="40" rx="5" fill="rgba(10,22,37,0.9)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="590" y="558" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">lv-pvc-ghi789</text>
  <text x="590" y="572" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">20 Gi · thin provisioned</text>

  <!-- Arrow VG → LVs -->
  <path d="M 210 468 L 170 538" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" opacity="0.5"/>
  <path d="M 210 468 L 380 538" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" opacity="0.5"/>
  <path d="M 210 468 L 590 538" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" opacity="0.5"/>

  <!-- Bottom legend -->
  <rect x="60" y="610" width="700" height="1" fill="#1e293b"/>

  <!-- ═══════════════ INFO BOX ═══════════════ -->
  <rect x="80" y="628" width="660" height="105" rx="8" fill="rgba(15,15,25,0.6)" stroke="#1e293b" stroke-width="1"/>

  <text x="100" y="648" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="600">▲ PVC tetap Pending sampai ada Pod</text>
  <text x="100" y="664" fill="#64748b" font-family="sans-serif" font-size="9">WaitForFirstConsumer: Logical Volume hanya dibuat setelah scheduler memilih node untuk Pod</text>

  <text x="100" y="686" fill="#34d399" font-family="monospace" font-size="10" font-weight="600">▲ CSI Controller embedded di Operator binary</text>
  <text x="100" y="702" fill="#64748b" font-family="sans-serif" font-size="9">Bukan komponen terpisah — topolvm-controller dikompilasi langsung ke binary LVM Operator</text>

  <text x="100" y="724" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="600">▲ OverprovisionRatio: 10 — hati-hati!</text>
  <text x="100" y="738" fill="#64748b" font-family="sans-serif" font-size="9">PVC bisa declare 10x kapasitas fisik. Jika semua PVC terisi penuh → disk habis → semua PVC read-only</text>
</svg>
